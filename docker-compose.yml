services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    restart: no
    volumes:
      - mailpit:/data
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1


  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: foi_manager
      POSTGRES_USER: foi_manager
      POSTGRES_PASSWORD: foi_manager
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Ollama is deliberately NOT here. Run it natively instead:
  #
  #     brew install ollama && brew services start ollama
  #     ollama pull nomic-embed-text
  #
  # A container cannot reach Metal on Apple Silicon — Docker Desktop runs a
  # Linux VM and there is no GPU passthrough — so the containerised model ran
  # entirely on emulated CPU across every core, and a bulk embedding run took
  # the machine to 100°C. Natively it uses the GPU: far faster, and cool.
  #
  # Nothing needs configuring. OLLAMA_BASE_URL already defaults to
  # localhost:11434, which is where the container published anyway, so the
  # application cannot tell the two apart.
  #
  # docker-compose.prod.yml keeps its ollama service, and should: that is a
  # Linux host, where a container is the right answer and a GPU is reachable.

volumes:
  postgres_data:
  mailpit:
